plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shouqianji.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.shouqianji.app"
        minSdk 26
        targetSdk 35
        versionCode 300
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
